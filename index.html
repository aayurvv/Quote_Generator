<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InspireMe - Quote Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1><i class="fas fa-quote-left"></i> InspireMe</h1>
            <p>Daily inspiration at your fingertips</p>
        </div>

        <!-- Quote Card -->
        <div class="quote-card" id="quoteCard">
            <div class="quote-icon">
                <i class="fas fa-quote-left"></i>
            </div>
            
            <div class="quote-content">
                <p class="quote-text" id="quoteText">
                    "The only way to do great work is to love what you do."
                </p>
                <p class="quote-author" id="quoteAuthor">- Steve Jobs</p>
            </div>

            <div class="quote-actions">
                <button class="btn btn-primary" id="newQuoteBtn">
                    <i class="fas fa-sync-alt"></i> New Quote
                </button>
                <button class="btn btn-twitter" id="shareBtn">
                    <i class="fab fa-twitter"></i> Share
                </button>
                <button class="btn btn-favorite" id="favoriteBtn">
                    <i class="far fa-heart"></i> Favorite
                </button>
            </div>
        </div>

        <!-- Favorites Section -->
        <div class="favorites-section">
            <h3><i class="fas fa-heart"></i> Your Favorites</h3>
            <div class="favorites-list" id="favoritesList">
                <p class="empty-message">No favorites yet. Click ❤️ to save quotes!</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="footer">
            <p>© 2026 InspireMe | Built with ❤️</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
